<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Shattered Realms – Voice GM</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="app">

        <header>
            <h1>🜁 The Shattered Realms</h1>
            <p>Your AI-powered D&D-style Game Master</p>
        </header>

        <!-- SCENE LOG -->
        <div id="scene-log" class="log"></div>

        <!-- PLAYER TRANSCRIPTION -->
        <div id="transcript-box" class="transcript">
            <span id="transcript-text">Speak to begin your adventure…</span>
        </div>

        <!-- CONTROLS -->
        <div class="controls">
            <button id="start-btn">🎤 Start Listening</button>
            <button id="restart-btn">🔁 Restart Story</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
